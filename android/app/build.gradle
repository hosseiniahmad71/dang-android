plugins { id 'com.android.application' }
android {
    namespace 'ir.dang.household'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.dang.household'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '7.2.0-alpha'
    }
    buildTypes {
        release { minifyEnabled false }
        debug {
            minifyEnabled false
            // Separate package: installs beside an older APK with a different signing key.
            applicationIdSuffix '.preview72'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
