plugins { id 'com.android.application' }
android {
    namespace 'ir.dang.household'
    compileSdk 35
    testBuildType providers.gradleProperty('dongTestBuildType').getOrElse('debug')
    defaultConfig {
        applicationId 'ir.dong.household'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 16
        versionName '1.0.0'
    }
    signingConfigs {
        stable {
            if (System.getenv('DONG_KEYSTORE_PATH')) {
                storeFile file(System.getenv('DONG_KEYSTORE_PATH'))
                storePassword System.getenv('DONG_KEYSTORE_PASSWORD')
                storeType 'pkcs12'
                keyAlias System.getenv('DONG_KEY_ALIAS')
                keyPassword System.getenv('DONG_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.stable }
        debug {
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
