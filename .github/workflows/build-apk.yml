name: Build Dang Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify preinstalled Android SDK and install required packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          test -f "${ANDROID_HOME}/platforms/android-35/android.jar"
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Run web type check and compile
        run: npm run build:android
      - name: Verify finance runtime
        run: npm run test:native
      - name: Test Android system bars regression contract
        run: node --test tests/android-system-bars.test.mjs
      - name: Verify separate-install package identity
        run: node --test tests/android-parallel-install.test.mjs
      - name: Audit 500 transactions in each of 1, 3 and 6 month windows
        run: node --test tests/finance-v71.test.mjs tests/v71-ui-contract.test.mjs
      - name: Test financial start boundary, card-owner attribution and cancellation history
        run: node --test tests/v72-period-purchase-history.test.mjs
      - name: Build signed debug APK
        run: cd android && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dang-v7.2.0-period-history-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
