name: Build Dang Android APK
on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build with the user-provided persistent signing key'
        type: boolean
        default: false
      target_package:
        description: 'preview71 requires the exact verified 7.1 signing key'
        type: choice
        options: ['ir.dang.household', 'ir.dang.household.preview71']
        default: 'ir.dang.household'
  push:
    branches: [main, work/7.3-startup-integrity]
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify preinstalled Android SDK and install required packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          test -f "${ANDROID_HOME}/platforms/android-35/android.jar"
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Run web type check and compile
        run: npm run build:android && node scripts/build-android-test.mjs
      - name: Verify finance runtime
        run: npm run test:native
      - name: Test Android system bars regression contract
        run: node --test tests/android-system-bars.test.mjs
      - name: Verify diagnostic package identity
        run: node --test tests/android-parallel-install.test.mjs
      - name: Audit 500 transactions in each of 1, 3 and 6 month windows
        run: node --test tests/finance-v71.test.mjs tests/v71-ui-contract.test.mjs
      - name: Test financial start boundary, card-owner attribution and cancellation history
        run: node --test tests/v72-period-purchase-history.test.mjs
      - name: Run complete regression suite
        run: node --test tests/*.test.mjs tests/ui-contract.test.cjs
      - name: Prepare disposable CI-only validation signer
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/dang-validation.jks" -storepass ci-validation-only -keypass ci-validation-only -alias validation -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=CI validation only'
          echo "DANG_KEYSTORE_PATH=$RUNNER_TEMP/dang-validation.jks" >> "$GITHUB_ENV"
          echo 'DANG_KEYSTORE_PASSWORD=ci-validation-only' >> "$GITHUB_ENV"
          echo 'DANG_KEY_ALIAS=validation' >> "$GITHUB_ENV"
          echo 'DANG_KEY_PASSWORD=ci-validation-only' >> "$GITHUB_ENV"
      - name: Build release payload for runtime validation
        run: cd android && gradle --no-daemon assembleRelease assembleReleaseAndroidTest -PdangTestBuildType=release
      - name: Verify actual APK package, assets and ZIP integrity
        run: |
          mkdir -p runtime-evidence
          python3 scripts/verify-apk.py android/app/build/outputs/apk/release/app-release.apk --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --expected-package ir.dang.household | tee runtime-evidence/apk-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: Dang-v7.3.0-release-payload-CI-validation-only
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Enable KVM for Android runtime tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute real Android WebView and SQLite tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/run-android-test.sh
      - name: Collect runtime evidence
        if: always()
        run: |
          mkdir -p runtime-evidence
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > runtime-evidence/signature.txt
          sha256sum android/app/build/outputs/apk/release/app-release.apk > runtime-evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dang-v7.3-runtime-evidence
          path: |
            runtime-evidence/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
      - name: Build persistent-key release only when explicitly selected
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        env:
          DANG_KEYSTORE_BASE64: ${{ secrets.DANG_KEYSTORE_BASE64 }}
          DANG_KEYSTORE_PASSWORD: ${{ secrets.DANG_KEYSTORE_PASSWORD }}
          DANG_KEY_ALIAS: ${{ secrets.DANG_KEY_ALIAS }}
          DANG_KEY_PASSWORD: ${{ secrets.DANG_KEY_PASSWORD }}
          DANG_KEYSTORE_PATH: ${{ runner.temp }}/dang-release.jks
          TARGET_PACKAGE: ${{ inputs.target_package }}
        run: |
          set -euo pipefail
          test -n "$DANG_KEYSTORE_BASE64" && test -n "$DANG_KEYSTORE_PASSWORD" && test -n "$DANG_KEY_ALIAS" && test -n "$DANG_KEY_PASSWORD" || { echo 'Persistent signing credentials must be supplied by the user in GitHub Secrets.'; exit 1; }
          trap 'rm -f "$DANG_KEYSTORE_PATH"' EXIT
          printf '%s' "$DANG_KEYSTORE_BASE64" | base64 --decode > "$DANG_KEYSTORE_PATH"
          chmod 600 "$DANG_KEYSTORE_PATH"
          cd android
          gradle --no-daemon assembleRelease -PdangApplicationId="$TARGET_PACKAGE"
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --verbose --print-certs "$APK" | tee release-signature.txt
          if [ "$TARGET_PACKAGE" = ir.dang.household.preview71 ]; then
            grep -q 'certificate SHA-256 digest: 21c3f5d6bd2507b8c96d8d35a3f1afa8c8c24171afe85b8bbe2d0b771643f005' release-signature.txt || { echo 'Refusing incompatible 7.1 upgrade'; rm -f "$APK"; exit 1; }
          elif [ "$TARGET_PACKAGE" = ir.dang.household ]; then
            grep -q 'certificate SHA-256 digest: 2b468a624312d5db6028984714f8c9663f6873c87c9a950c5fe0fc6787416108' release-signature.txt || { echo 'Refusing a production signing-key change'; rm -f "$APK"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'workflow_dispatch' && inputs.build_release
        with:
          name: Dang-v7.3-persistent-key-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/release-signature.txt
          if-no-files-found: error

      - name: Remove disposable CI key
        if: always()
        run: rm -f "$RUNNER_TEMP/dang-validation.jks"
