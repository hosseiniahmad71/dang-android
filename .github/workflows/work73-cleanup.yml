name: Cancel obsolete Work 7.3 diagnostic run
on:
  push:
    branches: [work/7.3-startup-integrity]
    paths: [.github/workflows/work73-cleanup.yml]
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run_id = 39925238227;
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
            if (data.status !== 'completed') {
              await github.rest.actions.cancelWorkflowRun({owner, repo, run_id});
              core.info('Cancelled the obsolete Work 7.3 run blocked after emulator shutdown.');
            }
