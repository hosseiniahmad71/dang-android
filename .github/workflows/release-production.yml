name: Release Dong with permanent owner signer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [release/release.json]
permissions:
  contents: read
concurrency:
  group: dong-release-owner-signing
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify source, financial invariants and Dong identity
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:android
          node scripts/build-android-test.mjs
          node --test tests/*.test.mjs tests/ui-contract.test.cjs
      - name: Enforce version increment and pinned previous source
        run: |
          node - <<'NODE'
          const x=require('./release/release.json');
          if(x.applicationId!=='ir.dong.household'||x.product!=='Dong')throw Error('Wrong app identity');
          if(!Number.isInteger(x.versionCode)||x.versionCode<=x.previousRelease?.versionCode)throw Error('Version code did not increase');
          if(!x.previousRelease?.sourceCommit)throw Error('Missing reproducible previous source');
          if(x.certificateSha256!==x.previousRelease.certificateSha256)throw Error('Signer changed');
          console.log('Production upgrade requires baseline',x.previousRelease.versionCode,'and candidate',x.versionCode);
          NODE
      - name: Load private owner key from Secrets only
        env:
          DONG_KEYSTORE_BASE64: ${{ secrets.DONG_KEYSTORE_BASE64 }}
          DONG_KEYSTORE_PASSWORD: ${{ secrets.DONG_KEYSTORE_PASSWORD }}
          DONG_KEY_ALIAS: ${{ secrets.DONG_KEY_ALIAS }}
          DONG_KEY_PASSWORD: ${{ secrets.DONG_KEY_PASSWORD }}
          DONG_KEYSTORE_PATH: ${{ runner.temp }}/dong-release.p12
        run: |
          set -euo pipefail
          test -n "$DONG_KEYSTORE_BASE64"
          test -n "$DONG_KEYSTORE_PASSWORD"
          test -n "$DONG_KEY_ALIAS"
          test -n "$DONG_KEY_PASSWORD"
          test "$DONG_KEY_ALIAS" = 'dong-release'
          umask 077
          printf '%s' "$DONG_KEYSTORE_BASE64" | base64 --decode > "$DONG_KEYSTORE_PATH"
          test -s "$DONG_KEYSTORE_PATH"
          echo "DONG_KEYSTORE_PATH=$DONG_KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Compile and sign APK with permanent Dong key
        env:
          DONG_KEYSTORE_PASSWORD: ${{ secrets.DONG_KEYSTORE_PASSWORD }}
          DONG_KEY_ALIAS: ${{ secrets.DONG_KEY_ALIAS }}
          DONG_KEY_PASSWORD: ${{ secrets.DONG_KEY_PASSWORD }}
        run: |
          cd android
          gradle --no-daemon assembleRelease assembleReleaseAndroidTest -PdongTestBuildType=release
      - name: Pin APK package identity, version and owner certificate
        run: |
          set -euo pipefail
          set -euo pipefail
          mkdir -p production-evidence
          python3 scripts/verify-apk.py android/app/build/outputs/apk/release/app-release.apk --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --expected-package ir.dong.household | tee production-evidence/apk-metadata.json
          python3 - <<'PY'
          import subprocess,os,hashlib,json,pathlib
          root=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          p=pathlib.Path('android/app/build/outputs/apk/release/app-release.apk')
          cfg=json.loads(pathlib.Path('release/release.json').read_text())
          verify=subprocess.check_output([str(root/'apksigner'),'verify','--print-certs',str(p)],text=True).lower()
          assert 'certificate sha-256 digest: '+cfg['certificateSha256'] in verify,'Dong owner certificate mismatch'
          info=subprocess.check_output([str(root/'aapt'),'dump','badging',str(p)],text=True)
          assert "package: name='"+cfg['applicationId']+"'" in info,'Unexpected package identity'
          assert "versionCode='"+str(cfg['versionCode'])+"'" in info,'Unexpected versionCode'
          assert "versionName='"+cfg['versionName']+"'" in info,'Unexpected versionName'
          evidence={'apkSha256':hashlib.sha256(p.read_bytes()).hexdigest(),'certificateSha256':cfg['certificateSha256'],'applicationId':cfg['applicationId'],'versionName':cfg['versionName'],'versionCode':cfg['versionCode']}
          pathlib.Path('production-evidence/identity.json').write_text(json.dumps(evidence,indent=2))
          print(json.dumps(evidence,indent=2))
          PY
      - name: Build pinned previous release using SAME permanent owner signer
        env:
          DONG_KEYSTORE_PASSWORD: ${{ secrets.DONG_KEYSTORE_PASSWORD }}
          DONG_KEY_ALIAS: ${{ secrets.DONG_KEY_ALIAS }}
          DONG_KEY_PASSWORD: ${{ secrets.DONG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BASE_COMMIT="$(node -p "require('./release/release.json').previousRelease.sourceCommit")"
          git worktree add --detach "$RUNNER_TEMP/dong-prev" "$BASE_COMMIT"
          (
            cd "$RUNNER_TEMP/dong-prev"
            npm ci --no-audit --no-fund
            npm run build:android
            cd android
            gradle --no-daemon assembleRelease
          )
          mkdir -p upgrade-evidence
          cp "$RUNNER_TEMP/dong-prev/android/app/build/outputs/apk/release/app-release.apk" upgrade-evidence/dong-previous-ci.apk
      - name: Sign instrumentation APK with the exact same owner key
        env:
          DONG_KEYSTORE_PASSWORD: ${{ secrets.DONG_KEYSTORE_PASSWORD }}
          DONG_KEY_ALIAS: ${{ secrets.DONG_KEY_ALIAS }}
          DONG_KEY_PASSWORD: ${{ secrets.DONG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          OUT=android/app/build/outputs/apk/androidTest/release/dong-test-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$DONG_KEYSTORE_PATH" --ks-key-alias "$DONG_KEY_ALIAS" --ks-pass env:DONG_KEYSTORE_PASSWORD --key-pass env:DONG_KEY_PASSWORD --out "$OUT" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$OUT"
      - name: Enable KVM for Android test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check official APK launches and SQLite runs in offline emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/run-android-test.sh && DONG_UPGRADE_SIGNER_KIND=owner DONG_ANDROID_TEST_APK=android/app/build/outputs/apk/androidTest/release/dong-test-signed.apk bash scripts/run-ci-upgrade-test.sh
      - name: Store the verified owner-signed APK and metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dong-OWNER-SIGNED-VERIFIED-UPGRADE
          retention-days: 90
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            production-evidence/
            upgrade-evidence/upgrade-summary.json
            upgrade-evidence/install-upgrade.txt
            upgrade-evidence/seed.txt
            upgrade-evidence/verify.txt
          if-no-files-found: error
      - name: Destroy temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/dong-release.p12"
